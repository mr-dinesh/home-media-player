services:

  icecast:
    image: moul/icecast
    container_name: icecast
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./icecast/icecast.xml:/etc/icecast2/icecast.xml:ro
    networks:
      - radionet

  liquidsoap:
    image: savonet/liquidsoap:v2.2.5
    container_name: liquidsoap
    restart: unless-stopped
    depends_on:
      - icecast
    ports:
      # Telnet control has no auth, so publish it on the host only
      # (scripts/radio.sh uses it for skip).
      - "127.0.0.1:1234:1234"
    environment:
      # Read from .env; must match Icecast's <source-password>.
      ICECAST_SOURCE_PASSWORD: "${ICECAST_SOURCE_PASSWORD:?set it in .env}"
    volumes:
      - ./liquidsoap/radio.liq:/etc/liquidsoap/radio.liq:ro
      - /home/tester/Music:/music:ro
      # Kept outside ~/Music so Navidrome doesn't index it; Sivers.m3u uses /sivers/ paths.
      - /home/tester/Music-Sivers:/sivers:ro
      - ./playlists:/playlists
    command: ["/etc/liquidsoap/radio.liq"]
    networks:
      - radionet

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      ND_SCANSCHEDULE: "1h"
      ND_LOGLEVEL: "info"
      ND_SESSIONTIMEOUT: "24h"
      ND_BASEURL: ""
      ND_MUSICFOLDER: "/music"
    volumes:
      - ./navidrome/data:/data
      - /home/tester/Music:/music:ro
    networks:
      - radionet

networks:
  radionet:
    driver: bridge
